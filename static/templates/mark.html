<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 30px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 18px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            font-size: 13px;
            color: #777;
            margin-top: 20px;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Attendance ✅</h2>

    <p>QR Code scanned successfully.</p>

    <p>Enter your Student ID</p>

    <form id="form">

        <input
            type="text"
            id="student_id"
            placeholder="Enter Student ID"
            required
            autocomplete="off"
            autocapitalize="none"
        >

        <button type="submit" id="submitBtn">
            Mark Attendance
        </button>

    </form>

    <p id="result"></p>

    <!-- Temporary debugging information -->
    <p class="info" id="debugInfo"></p>

</div>


<script>

const params  = new URLSearchParams(window.location.search);
const token   = params.get("token");
const version = params.get("version");

// Record when the page opened (used for timing features)
const pageOpenTime = Date.now();

const form        = document.getElementById("form");
const submitBtn   = document.getElementById("submitBtn");
const resultEl    = document.getElementById("result");
const studentInput = document.getElementById("student_id");
const debugInfo   = document.getElementById("debugInfo");

// Validate QR parameters on load
if (!token || !version) {
    resultEl.textContent = "Invalid QR code. Token or version is missing ❌";
    resultEl.className   = "error";
    submitBtn.disabled   = true;
} else {
    debugInfo.textContent = "QR Version: " + version;
}

// ── Main submit handler ──────────────────────────────────────────────────────
form.addEventListener("submit", function(e) {
    e.preventDefault();

    const student_id = studentInput.value.trim();

    if (!student_id) {
        resultEl.textContent = "Please enter your Student ID.";
        resultEl.className   = "error";
        return;
    }

    if (!token || !version) {
        resultEl.textContent = "Invalid QR code. Please scan again ❌";
        resultEl.className   = "error";
        return;
    }

    // Disable immediately to prevent double-tap
    submitBtn.disabled   = true;
    submitBtn.textContent = "Getting location…";
    resultEl.textContent  = "";
    resultEl.className    = "";

    if (!navigator.geolocation) {
        // No GPS support — submit without coordinates
        submitAttendance(student_id, null, null, null);
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            submitAttendance(
                student_id,
                position.coords.latitude,
                position.coords.longitude,
                position.coords.accuracy
            );
        },
        function(err) {
            console.warn("GPS denied or unavailable:", err.message);
            // Submit without coordinates rather than blocking the student
            submitAttendance(student_id, null, null, null);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
});

// ── Attendance submission ────────────────────────────────────────────────────
async function submitAttendance(student_id, latitude, longitude, gps_accuracy) {

    submitBtn.textContent = "Submitting…";

    const submitTime = Date.now();

    const deviceData = {
        user_agent:          navigator.userAgent  || "",
        platform:            navigator.platform   || "",
        screen_width:        window.screen.width  || 0,
        screen_height:       window.screen.height || 0,
        language:            navigator.language   || "",
        timezone:            Intl.DateTimeFormat().resolvedOptions().timeZone || "",
        device_type:         /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "mobile" : "desktop",
        page_open_time:      pageOpenTime,
        submit_time:         submitTime,
        typing_time:         (submitTime - pageOpenTime) / 1000,
        scan_to_submit_time: (submitTime - pageOpenTime) / 1000
    };

    const payload = {
        student_id:   student_id,
        token:        token,
        version:      parseInt(version, 10),
        latitude:     latitude,
        longitude:    longitude,
        gps_accuracy: gps_accuracy,
        device_data:  deviceData
    };

    try {
        const response = await fetch("/mark-attendance", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify(payload)
        });

        let data;
        try {
            data = await response.json();
        } catch (jsonErr) {
            throw new Error("Server returned an invalid response.");
        }

        if (response.ok) {
            // Success
            resultEl.textContent  = data.message || "Attendance marked successfully ✅";
            resultEl.className    = "success";
            submitBtn.textContent = "Attendance Marked ✓";
            submitBtn.disabled    = true;
            studentInput.disabled = true;

        } else {
            // Server returned an error (4xx / 5xx)
            resultEl.textContent  = data.error || "Attendance could not be marked ❌";
            resultEl.className    = "error";
            submitBtn.disabled    = false;
            submitBtn.textContent = "Mark Attendance";
        }

    } catch (networkErr) {
        console.error("Attendance error:", networkErr);
        resultEl.textContent  = "Could not reach the server. Check your connection and try again ❌";
        resultEl.className    = "error";
        submitBtn.disabled    = false;
        submitBtn.textContent = "Mark Attendance";
    }
}

</script>

</body>
</html>
