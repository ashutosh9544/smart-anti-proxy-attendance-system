<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f6fa;
            text-align: center;
            margin-top: 100px;
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            width: 340px;
            margin: auto;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2f3640;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 14px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0069d9;
        }

        .error {
            color: #e84118;
            margin-bottom: 14px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🔐 Teacher Login</h2>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" required autocomplete="username">
        <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
