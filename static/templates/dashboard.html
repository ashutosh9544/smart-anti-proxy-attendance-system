<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f6fa;
            text-align: center;
        }

        .container {
            margin-top: 50px;
        }

        h2 {
            color: #2f3640;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            background: #4cd137;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #44bd32;
        }

        #timer {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #e84118;
        }

        .qr-box {
            margin-top: 30px;
        }

        img {
            width: 250px;
            border: 4px solid #dcdde1;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
        }

        .top-bar {            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .teacher-name {
            font-size: 14px;
            color: #636e72;
        }

        .logout-btn {
            padding: 6px 14px;
            font-size: 13px;
            background: #e84118;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin:25px 0;
}

.stat-card{
    background:#ffffff;
    border-radius:10px;
    padding:18px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.stat-card h3{
    margin-bottom:10px;
    font-size:16px;
}

.stat-card p{
    font-size:28px;
    font-weight:bold;
    color:#2563eb;
}
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div id="statsContainer" class="stats-grid">

    <div class="stat-card">
        <h3>Total Students</h3>
        <p id="totalStudents">--</p>
    </div>

    <div class="stat-card">
        <h3>Total Sessions</h3>
        <p id="totalSessions">--</p>
    </div>

    <div class="stat-card">
        <h3>Total Attendance</h3>
        <p id="totalAttendance">--</p>
    </div>

    <div class="stat-card">
        <h3>Active Session</h3>
        <p id="activeSession">--</p>
    </div>

    <div class="stat-card">
        <h3>Last Session</h3>
        <p id="lastSession">--</p>
    </div>

</div>

        <div class="top-bar">
            <span class="teacher-name">👤 {{ teacher_name }}</span>
            <form method="POST" action="/logout" style="display:inline;">
                <button class="logout-btn" type="submit">Logout</button>
            </form>
        </div>

        <h2>📊 Teacher Dashboard</h2>

        <button onclick="startSession()">Start Session</button>
        <button onclick="window.location.href='/manage-students'">Manage Students</button>
        <button onclick="window.location.href='/attendance-records'">Attendance Records</button>
        <button onclick="exportData()">Export Attendance</button>
        <button onclick="window.location.href='/suspicious-attendance'">
    ⚠️ Suspicious Attendance
</button>

        <div id="timer">Session not started</div>

        <div class="qr-box">
            <img id="qrImage" style="display:none;">
        </div>

        <div id="pinContainer" style="display:none; margin-top:15px;">
         <h3>Attendance PIN</h3>
         <h2 id="sessionPin">----</h2>
        </div>

    </div>
</div>

<script>
// Redirect to login if any protected API returns 401
function handleAuthError(res) {
    if (res.status === 401) {
        window.location.href = "/login";
        return true;
    }
    return false;
}

function startSession() {
    fetch('/start-session')
    .then(res => {
        if (handleAuthError(res)) return;
        return res.json();
    })
    .then(data => {
        if (!data) return;

        const qr = document.getElementById("qrImage");
        if (data.qr_code) {
            let qrVersion = 1;

qr.src = "/static/qrcodes/qr_1.png?t=" + Date.now();

const qrRotationTimer = setInterval(() => {

    qrVersion++;

    if (qrVersion > 6) {
        clearInterval(qrRotationTimer);
        return;
    }

    qr.src = `/static/qrcodes/qr_${qrVersion}.png?t=${Date.now()}`;

}, 20000);
            qr.style.display = "block";
        }

        const pinContainer = document.getElementById("pinContainer");
        const sessionPin = document.getElementById("sessionPin");
        if (data.pin) {
            sessionPin.textContent = data.pin;
            pinContainer.style.display = "block";
        } else {
            pinContainer.style.display = "none";
        }

        let expiryTime = new Date(data.expires_at);

        if (isNaN(expiryTime.getTime())) {
            document.getElementById("timer").innerHTML = "Timer error ❌";
            return;
        }

        setInterval(() => {
            qr.src = "/static/qrcodes/current_qr.png?t=" + Date.now();
        }, 20000);

        let expiry = expiryTime.getTime();

        let x = setInterval(function () {
            let now = new Date().getTime();
            let distance = expiry - now;

            if (distance <= 0) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "QR EXPIRED ❌";
                return;
            }

            let minutes = Math.floor(distance / 60000);
            let seconds = Math.floor((distance % 60000) / 1000);

            document.getElementById("timer").innerHTML =
                `QR expires in: ${minutes}m ${seconds}s`;

        }, 1000);
    });
}

function exportData() {
    window.location.href = "/export";
}

async function loadDashboardStats(){

    try{

        const res = await fetch("/dashboard-stats");
        const data = await res.json();

        if(!data.success) return;

        document.getElementById("totalStudents").textContent =
            data.total_students;

        document.getElementById("totalSessions").textContent =
            data.total_sessions;

        document.getElementById("totalAttendance").textContent =
            data.total_attendance;

        document.getElementById("activeSession").textContent =
            data.active_session ? "Yes" : "No";

        document.getElementById("lastSession").textContent =
            data.last_session || "None";

    }

    catch(err){

        console.log(err);

    }

}

loadDashboardStats();
</script>

</body>
</html>
