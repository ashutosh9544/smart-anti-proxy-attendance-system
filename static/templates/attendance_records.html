<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            color: #2f3640;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .back-btn, .view-btn {
            background: #4cd137;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn {
            background: #4073ff;
        }

        .status {
            margin: 10px 0 20px;
            color: #2d3436;
            font-weight: 600;
        }

        .session-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .session-card {
            background: #f9fafb;
            border: 1px solid #dfe6e9;
            border-radius: 10px;
            padding: 16px;
        }

        .session-card h3 {
            margin-top: 0;
            font-size: 18px;
        }

        .meta {
            margin: 8px 0;
            color: #535c68;
            font-size: 14px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #dfe6e9;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f1f2f6;
        }

        .muted {
            color: #636e72;
        }

        .error {
            color: #d63031;
            font-weight: bold;
        }

        .empty {
            color: #636e72;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <h2>Attendance Records</h2>
            <button class="back-btn" onclick="window.location.href='/dashboard'">Back to Dashboard</button>
        </div>

        <div id="status" class="status">Loading attendance sessions...</div>

        <div id="sessionList" class="session-list"></div>

        <div id="sessionDetail" class="table-wrap" style="display:none;">
            <h3 id="detailTitle">Session Details</h3>
            <div id="detailMeta" class="meta"></div>
            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Timestamp</th>
                        <th>Marked By</th>
                    </tr>
                </thead>
                <tbody id="attendanceRows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const sessionListEl = document.getElementById('sessionList');
        const attendanceRowsEl = document.getElementById('attendanceRows');
        const detailMetaEl = document.getElementById('detailMeta');
        const sessionDetailEl = document.getElementById('sessionDetail');
        const statusEl = document.getElementById('status');

        async function loadAttendanceSessions() {
            statusEl.textContent = 'Loading attendance sessions...';
            sessionListEl.innerHTML = '';

            try {
                const res = await fetch('/attendance-sessions');
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();
                if (!data.success) {
                    throw new Error(data.error || 'Could not load attendance sessions.');
                }

                if (!data.sessions || data.sessions.length === 0) {
                    statusEl.textContent = 'No attendance sessions found.';
                    return;
                }

                statusEl.textContent = `Showing ${data.sessions.length} session(s).`;

                data.sessions.forEach(session => {
                    const card = document.createElement('div');
                    card.className = 'session-card';
                    card.innerHTML = `
                        <h3>Session #${session.id}</h3>
                        <div class="meta">Started: ${session.start_time || 'N/A'}</div>
                        <div class="meta">Ends: ${session.end_time || 'N/A'}</div>
                        <div class="meta">Present: ${session.present_count || 0}</div>
                        <div class="meta">Active: ${session.active ? 'Yes' : 'No'}</div>
                        <button class="view-btn" type="button">View Details</button>
                    `;

                    const button = card.querySelector('button');
                    button.addEventListener('click', () => loadSessionDetails(session.id));

                    sessionListEl.appendChild(card);
                });
            } catch (error) {
                statusEl.textContent = error.message || 'Could not load attendance sessions.';
                statusEl.className = 'status error';
            }
        }

        async function loadSessionDetails(sessionId) {
            sessionDetailEl.style.display = 'none';
            statusEl.textContent = `Loading session #${sessionId} details...`;

            try {
                const res = await fetch(`/attendance-session/${sessionId}`);
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();
                if (!data.success) {
                    throw new Error(data.error || 'Could not load session details.');
                }

                const session = data.session || {};
                document.getElementById('detailTitle').textContent = `Session #${session.id}`;
                detailMetaEl.innerHTML = `
                    <strong>Started:</strong> ${session.start_time || 'N/A'}<br>
                    <strong>Ended:</strong> ${session.end_time || 'N/A'}<br>
                    <strong>Expires:</strong> ${session.expires_at || 'N/A'}<br>
                    <strong>Active:</strong> ${session.active ? 'Yes' : 'No'}<br>
                    <strong>Present Count:</strong> ${data.present_count || 0}
                `;

                attendanceRowsEl.innerHTML = '';

                if (!data.students || data.students.length === 0) {
                    attendanceRowsEl.innerHTML = '<tr><td colspan="6" class="empty">No students marked attendance for this session.</td></tr>';
                } else {
                    data.students.forEach(student => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${student.student_id || ''}</td>
                            <td>${student.name || ''}</td>
                            <td>${student.class || ''}</td>
                            <td>${student.section || ''}</td>
                            <td>${student.timestamp || ''}</td>
                            <td>${student.marked_by || ''}</td>
                        `;
                        attendanceRowsEl.appendChild(tr);
                    });
                }

                sessionDetailEl.style.display = 'block';
                statusEl.textContent = `Loaded session #${sessionId} with ${data.present_count || 0} present.`;
            } catch (error) {
                statusEl.textContent = error.message || 'Could not load session details.';
                statusEl.className = 'status error';
            }
        }

        loadAttendanceSessions();
    </script>
</body>
</html>
